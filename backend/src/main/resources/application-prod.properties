server.port=${PORT:10000}
server.address=0.0.0.0
spring.main.web-application-type=servlet

spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.validation-timeout=120000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.max-lifetime=600000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Enable detailed Spring Security logs in production for debugging filter decisions
logging.level.org.springframework.security=TRACE
logging.level.com.example.qlbv=DEBUG
spring.security.user.enabled=false
