workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: your.bundle.id
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Prepare App Store Connect key (from secret `ASC_API_KEY_P8`)
        script: |
          if [ -n "$ASC_API_KEY_P8" ]; then
            echo "$ASC_API_KEY_P8" > /tmp/AuthKey.p8
            chmod 600 /tmp/AuthKey.p8
          fi
      - name: Build IPA (signed)
        script: |
          flutter build ipa --export-method=app-store --no-tree-shake-icons
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key_path: /tmp/AuthKey.p8
        key_id: $ASC_KEY_ID
        issuer_id: $ASC_ISSUER_ID
        upload_to_testflight: true
        bundle_id: ${BUNDLE_ID}

  android-release:
    name: Android Release
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Prepare Google Play credentials (from secret `GP_JSON`)
        script: |
          if [ -n "$GP_JSON" ]; then
            echo "$GP_JSON" > /tmp/google-play.json
            chmod 600 /tmp/google-play.json
          fi
      - name: Prepare google-services.json for Android (from secret `GOOGLE_SERVICES_JSON` or `GOOGLE_SERVICES_JSON_BASE64`)
        script: |
          # Prefer raw JSON secret; fall back to base64-encoded secret
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Writing google-services.json from GOOGLE_SERVICES_JSON"
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Decoding and writing google-services.json from GOOGLE_SERVICES_JSON_BASE64"
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "ERROR: No google-services.json provided via GOOGLE_SERVICES_JSON or GOOGLE_SERVICES_JSON_BASE64"
            echo "Add the google-services.json as a Codemagic secret and re-run the build."
            exit 1
          fi
      - name: Build app bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.aab
    publishing:
      google_play:
        service_account_credentials: /tmp/google-play.json
        track: internal

  fast-tests:
    name: Fast tests
    environment:
      flutter: stable
    scripts:
      - name: Install deps
        script: |
          flutter pub get
      - name: Run analyzer
        script: |
          flutter analyze
      - name: Run unit tests
        script: |
          flutter test --coverage

# Notes:
# - Set Codemagic environment variables/secrets:
#   - ASC_API_KEY_P8 : contents of App Store Connect .p8 key
#   - ASC_KEY_ID     : Key ID from App Store Connect
#   - ASC_ISSUER_ID  : Issuer ID from App Store Connect
#   - GP_JSON        : google-play service account JSON contents
# - If you prefer to upload certificate/provisioning profile instead of ASC API, add steps to write them from secrets and configure the signing in the build step.
# - Adjust `BUNDLE_ID` and other settings to match your project's iOS bundle identifier.
